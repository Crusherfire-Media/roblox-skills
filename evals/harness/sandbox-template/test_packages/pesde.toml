# Jest Roblox, installed into its own folder so it mounts at ServerScriptService.Tests.Packages,
# outside ReplicatedStorage.Packages.
name = "eval/sandbox_test_packages"
version = "0.0.0"
private = true

[target]
environment = "roblox"

[scripts]
roblox_sync_config_generator = "../.pesde/scripts_rojo/roblox_sync_config_generator.luau"
sourcemap_generator = "../.pesde/scripts_rojo/sourcemap_generator.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Jest = { wally = "roblox/jest", version = "=3.20.1" }
JestGlobals = { wally = "roblox/jest-globals", version = "=3.20.1" }
