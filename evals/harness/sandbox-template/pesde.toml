name = "eval/sandbox"
version = "0.0.0"
private = true
workspace_members = ["test_packages"]

[target]
environment = "roblox"

[scripts]
roblox_sync_config_generator = ".pesde/scripts_rojo/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts_rojo/sourcemap_generator.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Vide = { wally = "centau/vide", version = "=0.4.1" }
Charm = { wally = "littensy/charm", version = "=0.11.1" }
VideCharm = { wally = "littensy/vide-charm", version = "=0.4.1" }
CharmSync = { wally = "littensy/charm-sync", version = "=0.4.1" }
UILabs = { wally = "pepeeltoro41/ui-labs", version = "=2.4.2" }
ModuleLoader = { wally = "crusherfire/module-loader", version = "=4.0.1" }

[dev_dependencies]
scripts_rojo = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
