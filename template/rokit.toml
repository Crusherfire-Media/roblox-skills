# Tools Rokit installs for this project. Run `rokit install` after changing a version.
# pesde is installed on its own with `pesde self-install`, as pesde's docs recommend.

[tools]
# Rojo 7.6.1 keeps `rojo serve` running when files are deleted or renamed. 7.7.0 and 7.7.1
# crash in that case (rojo-rbx/rojo#1338). Keep the `rojo` version in pesde.toml the same.
rojo = "rojo-rbx/rojo@7.6.1"
# Lune runs pesde's scripts. pesde's Rojo scripts ask for Lune 0.10, so 0.11 prints warnings.
lune = "lune-org/lune@0.10.5"
stylua = "JohnnyMorganz/StyLua@2.6.0"
selene = "Kampfkarren/selene@0.32.0"
luau-lsp = "JohnnyMorganz/luau-lsp@1.70.1"
