# Jest Roblox, mounted at ServerScriptService.Tests.Packages by
# src/ServerScriptService/Tests/Packages/default.project.json.
# `pesde install` at the repo root installs this too.
name = "local/my_game_test_packages"
version = "0.0.0"
private = true

[target]
environment = "roblox"

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Jest = { wally = "roblox/jest", version = "=3.21.0" }
JestGlobals = { wally = "roblox/jest-globals", version = "=3.21.0" }
