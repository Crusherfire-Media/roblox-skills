name = "local/my_game"
version = "0.0.0"
private = true
# test_packages holds Jest, so the test runner stays out of the game's packages.
workspace_members = ["test_packages"]

[target]
environment = "roblox"

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[engines]
pesde = "^0.7.4"

[dependencies]
ModuleLoader = { wally = "crusherfire/module-loader", version = "=4.0.1" }

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
# pesde links this Rojo into ~/.pesde/bin, where it can come before Rokit's on PATH.
# Pinning it to the version in rokit.toml means both run the same Rojo.
rojo = { name = "pesde/rojo", version = "=7.6.1", target = "lune" }
