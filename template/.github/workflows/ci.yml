name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its older run. Each push to main
# gets its own group, so every merge is checked and published.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  PESDE_VERSION: 0.7.4+registry.0.2.3
  ROKIT_VERSION: v1.2.0

jobs:
  # Which experiences places.json has set up. Specs and staging skip until theirs is.
  places:
    name: Places
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci: ${{ steps.read.outputs.ci }}
      staging: ${{ steps.read.outputs.staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: places.json
          sparse-checkout-cone-mode: false
      - name: Read places.json
        id: read
        run: |
          for environment in ci staging; do
            if jq -e --arg e "$environment" '.universes[$e] != null' places.json > /dev/null; then
              echo "$environment=true" >> "$GITHUB_OUTPUT"
            else
              echo "places.json has no $environment universe yet, so its jobs skip (tools/ci/README.md)."
            fi
          done

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: ${{ env.ROKIT_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pesde
        run: bash tools/ci/install-pesde.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install packages
        run: pesde install --locked || { echo "Retrying in 30 seconds"; sleep 30; pesde install --locked; }
      # Also checks places.json against the place folders.
      - name: Build every place
        run: lune run tools/ci/build
      - name: Download Roblox type definitions
        run: >-
          curl -fsSL --retry 3 -o globalTypes.None.d.luau
          https://luau-lsp.pages.dev/type-definitions/globalTypes.None.d.luau
      # Each place has its own DataModel, so each gets its own sourcemap.
      # The build step checked the names, so they're safe as words here.
      - name: luau-lsp analyze
        run: |
          for place in $(jq -r '.places | keys[]' places.json); do
            echo "Analyzing places/$place"
            rojo sourcemap "places/$place/default.project.json" -o sourcemap.json --absolute
            luau-lsp analyze --platform=roblox --sourcemap=sourcemap.json \
              --definitions:@roblox=globalTypes.None.d.luau \
              --ignore="**/roblox_packages/**" "places/$place/src"
          done
      - name: selene
        run: selene places tools
      - name: StyLua
        run: stylua --check places tools

  specs:
    name: Specs
    needs: [places, checks]
    # Skipped until places.json has the CI experience (tools/ci/README.md).
    if: needs.places.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Luau Execution allows 5 task creates per minute per key owner, so a
    # newer push cancels this branch's running specs instead of adding a task.
    concurrency:
      group: luau-execution-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: ${{ env.ROKIT_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pesde
        run: bash tools/ci/install-pesde.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install packages
        run: pesde install --locked || { echo "Retrying in 30 seconds"; sleep 30; pesde install --locked; }
      - name: Build every place
        run: lune run tools/ci/build
      # One task per place, all at once, each in that place's CI place.
      - name: Run the specs in the CI places
        run: lune run tools/ci/run-tests
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}

  staging:
    name: Publish to staging
    needs: [places, checks, specs]
    # Runs only after the specs pass, so it also waits for the CI experience.
    if: github.event_name == 'push' && needs.places.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-staging
      cancel-in-progress: false
    steps:
      # Pushes run in parallel, so an older one can finish last. Only main's
      # newest commit publishes, so staging never goes back to an older build.
      - name: Check this is main's newest commit
        id: head
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $main, so $GITHUB_SHA isn't published"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.head.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.head.outputs.current == 'true'
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: ${{ env.ROKIT_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pesde
        if: steps.head.outputs.current == 'true'
        run: bash tools/ci/install-pesde.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install packages
        if: steps.head.outputs.current == 'true'
        run: pesde install --locked || { echo "Retrying in 30 seconds"; sleep 30; pesde install --locked; }
      # Every place publishes, so shared code matches across them.
      - name: Build and publish every place
        if: steps.head.outputs.current == 'true'
        run: |
          lune run tools/ci/build
          lune run tools/ci/publish staging
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
